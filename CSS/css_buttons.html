<!DOCTYPE html>
<html>
<head>
    <title>CSS Buttons</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .primary {
            background-color: blue;
            color: white;
        }

        .success {
            background-color: green;
            color: white;
        }

        .danger {
            background-color: red;
            color: white;
        }

        .warning {
            background-color: orange;
            color: black;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <h1>CSS Buttons</h1>

    <button class="primary">Login</button>
    <button class="success">Submit</button>
    <button class="danger">Delete</button>
    <button class="warning">Warning</button>

</body>
</html>
