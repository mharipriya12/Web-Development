<!DOCTYPE html>
<html>
<head>
    <title>Basic Styling</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: blue;
            font-size: 40px;
        }

        p {
            color: #444;
            font-size: 20px;
            line-height: 1.6;
        }

        .box {
            background-color: white;
            padding: 20px;
            margin: 20px auto;
            width: 60%;
            border: 2px solid #333;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>My Web Page</h1>

    <div class="box">
        <h2>Welcome</h2>
        <p>
            This page demonstrates basic CSS styling using colors,
            fonts, borders, spacing and alignment.
        </p>
    </div>

</body>
</html>
