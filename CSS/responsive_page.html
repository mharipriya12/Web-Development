<!DOCTYPE html>
<html>
<head>
    <title>Responsive Page</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 30px;
        }

        nav {
            background-color: #444;
            display: flex;
            justify-content: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 15px 25px;
        }

        nav a:hover {
            background-color: #666;
        }

        .container {
            display: flex;
            gap: 20px;
            padding: 30px;
        }

        .box {
            flex: 1;
            background-color: #eee;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
        }

        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* Tablet and mobile screens */
        @media (max-width: 768px) {

            nav {
                flex-direction: column;
                text-align: center;
            }

            .container {
                flex-direction: column;
            }

            header h1 {
                font-size: 28px;
            }
        }

        /* Small mobile screens */
        @media (max-width: 480px) {

            header {
                padding: 20px;
            }

            header h1 {
                font-size: 24px;
            }

            .container {
                padding: 15px;
            }

            .box {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Responsive Website</h1>
        <p>Resize the browser window to see the effect.</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <main class="container">

        <div class="box">
            <h2>HTML</h2>
            <p>
                HTML is used to create the structure of a webpage.
            </p>
        </div>

        <div class="box">
            <h2>CSS</h2>
            <p>
                CSS is used to style and design webpages.
            </p>
        </div>

        <div class="box">
            <h2>JavaScript</h2>
            <p>
                JavaScript adds interaction and functionality.
            </p>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 My Website</p>
    </footer>

</body>
</html>
