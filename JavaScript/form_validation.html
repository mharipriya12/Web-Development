<!DOCTYPE html>
<html>
<head>
    <title>Form Validation</title>

    <style>
        body {
            font-family: Arial;
            margin: 50px;
        }

        form {
            width: 300px;
            margin: auto;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
        }

        button {
            padding: 10px 20px;
            margin-top: 10px;
        }

        #message {
            color: red;
        }
    </style>
</head>

<body>

<h2 style="text-align:center;">Registration Form</h2>

<form onsubmit="return validateForm()">

    <label>Name:</label>
    <input type="text" id="name">

    <label>Email:</label>
    <input type="text" id="email">

    <label>Password:</label>
    <input type="password" id="password">

    <label>Age:</label>
    <input type="number" id="age">

    <button type="submit">Submit</button>

    <p id="message"></p>

</form>

<script>
function validateForm() {

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;
    let age = document.getElementById("age").value;

    if (name == "") {
        document.getElementById("message").innerText = "Name is required";
        return false;
    }

    if (email == "") {
        document.getElementById("message").innerText = "Email is required";
        return false;
    }

    if (!email.includes("@")) {
        document.getElementById("message").innerText = "Enter a valid email";
        return false;
    }

    if (password.length < 6) {
        document.getElementById("message").innerText = "Password must contain at least 6 characters";
        return false;
    }

    if (age < 18) {
        document.getElementById("message").innerText = "Age must be 18 or above";
        return false;
    }

    alert("Form submitted successfully!");
    return true;
}
</script>

</body>
</html>
